# Local AI stack: Open WebUI (chat, memory, RAG, tools) + SearXNG (private web search)
# + render-guard (keeps chats off the GPU while ComfyUI renders).
# Ollama is NOT in here on purpose: it runs natively on Windows so it gets the RTX 3090 directly.
#
# Managed by Install-LocalAI.ps1 / Update-OpenWebUI.ps1. Secrets and versions come from the
# .env file the installer writes next to this file (C:\AI\Stack\.env, ACL-restricted).
#
# Every port is bound to 127.0.0.1 so nothing is reachable from the LAN. For phone access
# later, use `tailscale serve` in front of 127.0.0.1:3000 instead of opening ports.

name: localai

# Container logs are capped (Docker keeps them forever by default; the render guard alone can log
# thousands of lines a day while Ollama is down). 3 x 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Container hardening. Every service: no capabilities beyond the ones it is shown to need
# (cap_drop ALL), no way to gain any (no-new-privileges), a memory limit and a limit on processes
# and threads (pids_limit), so a runaway or taken-over container cannot starve the PC. Where the
# image allows it, also an unprivileged user and a read-only root filesystem.
# In the toolkit's repository: docs/CONTAINER-HARDENING-PLAN.md has the reasons, service by service;
# tests/Invoke-StaticChecks.ps1 (rule COMPOSESEC) refuses a service without the first four or with
# a published port that is not on 127.0.0.1; tests/Invoke-StackSmokeTest.ps1 reads all of it back
# from the running containers.
# Left out on purpose: CPU limits (a 'cpus' value above what the Docker VM has stops the container
# from being created), internal-only networks (every service needs the host or the internet) and
# image digests in the image lines (the update and rollback scripts work with repo:tag).

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.11.4}
    container_name: open-webui
    logging: *logging
    restart: always
    # Root inside the container (the image's own user) but without a single capability: its start
    # script and code need none. Not read-only: it rewrites its static files at every start and
    # installs the requirements of tools with pip. 16g leaves room for the embedder and the
    # reranker, which run on the CPU.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 16g
    pids_limit: 4096
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Same volume name as the manual `docker run -v open-webui:...` install, so chats,
      # memories and settings carry over and the guide's backup commands still work.
      - open-webui:/app/backend/data
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is missing from .env}
      WEBUI_URL: http://localhost:${WEBUI_PORT:-3000}
      # Only Open WebUI's own pages may call its API with your login (its default, "*", lets any page
      # served from localhost - a ComfyUI custom node, Deep Research's report page - do it). Phone
      # access adds its https://<pc>.<tailnet>.ts.net origin here (Enable-TailscaleAccess.ps1).
      CORS_ALLOW_ORIGIN: "http://localhost:${WEBUI_PORT:-3000};http://127.0.0.1:${WEBUI_PORT:-3000}${WEBUI_EXTRA_ORIGINS:-}"
      # Headless admin creation. Only used while the database has zero users; it also
      # disables open signup. The installer blanks the password in .env after first login.
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      # First-boot default only; the installer sets the live value through the API.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://render-guard:11434}
      ENABLE_OPENAI_API: "false"
      # First-boot defaults. Open WebUI copies these into its database on first start and
      # ignores them afterwards; the installer re-applies them through the API on every run.
      ENABLE_MEMORIES: "true"
      RAG_TEXT_SPLITTER: token
      ENABLE_MARKDOWN_HEADER_TEXT_SPLITTER: "true"
      CHUNK_SIZE: "1000"
      CHUNK_OVERLAP: "100"
      RAG_TOP_K: "10"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "5"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    depends_on:
      - searxng
      - render-guard

  # Pass-through proxy in front of Ollama (stack/render-guard/render_guard.py, standard library
  # only). While ComfyUI has a job running or queued, chats run on the CPU (num_gpu 0) instead of
  # pushing the render out of VRAM; when ComfyUI is idle but still caches models in VRAM, it asks
  # ComfyUI to free them first. Reuses the Python inside the already-pulled SearXNG image (no
  # extra download). Not published on any host port; only Open WebUI talks to it.
  render-guard:
    image: searxng/searxng:${SEARXNG_VERSION:-2026.10.2-19ffbcd30}
    container_name: render-guard
    logging: *logging
    restart: always
    entrypoint: ["python3", "-u", "/guard/render_guard.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # One thread per request plus a watcher, and it writes no files.
    mem_limit: 512m
    pids_limit: 512
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./render-guard:/guard:ro
    environment:
      UPSTREAM: ${OLLAMA_UPSTREAM:-http://host.docker.internal:11434}
      # Comfy Desktop listens on 8000, the portable build on 8188 (both on 127.0.0.1).
      COMFYUI_URLS: ${COMFYUI_URLS:-http://host.docker.internal:8188,http://host.docker.internal:8000}
      RENDER_GUARD_MODE: ${RENDER_GUARD_MODE:-cpu}
      FREE_COMFYUI_WHEN_IDLE: ${FREE_COMFYUI_WHEN_IDLE:-1}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:11434/render-guard/status',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-2026.10.2-19ffbcd30}
    container_name: searxng
    logging: *logging
    restart: always
    # The image starts as root; 977 is its own 'searxng' user. As that user its entrypoint skips
    # the change of owner on /etc/searxng (it says so in the log: expected) and the CA update, and
    # copies no settings: settings.yml is always written by the installer first, so the folder is
    # mounted read-only. At run time SearXNG writes only its SQLite caches, in /tmp.
    user: "977:977"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    tmpfs:
      - "/tmp:size=256m,mode=1777"
    ports:
      # Optional: lets you use http://localhost:8888 as a private search engine in your browser.
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      # The image listens on "::" by default, which fails on hosts without IPv6.
      # This is the bind address inside the container; exposure is still decided by "ports".
      GRANIAN_HOST: 0.0.0.0

  # Optional (Install-LocalAI.ps1 -DeepResearch): Local Deep Research, an agent that plans searches,
  # reads the pages through the private SearXNG above and writes a report with sources, using the
  # local models (through the render guard, so a ComfyUI render keeps the GPU). Started only when
  # COMPOSE_PROFILES in .env includes "research". No paid search API or key: the searches go through
  # SearXNG; the pages it reads are fetched directly (as a browser would), and it downloads public
  # journal lists (OpenAlex, DOAJ) for its source ratings. Port bound to 127.0.0.1.
  deep-research:
    image: localdeepresearch/local-deep-research:${DEEP_RESEARCH_VERSION:-1.10.7}
    container_name: deep-research
    profiles: ["research"]
    logging: *logging
    restart: always
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_PORT:-5055}:5000"
    volumes:
      - deep-research:/data
    # Its entrypoint starts as root to fix the volume's owner, then drops to its own user: these
    # are the capabilities it needs for that, nothing else.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    # Not read-only: where it writes outside /data has not been checked.
    mem_limit: 8g
    pids_limit: 2048
    ulimits:
      memlock: { soft: -1, hard: -1 }
    environment:
      LDR_WEB_HOST: 0.0.0.0
      LDR_WEB_PORT: "5000"
      LDR_DATA_DIR: /data
      LDR_LLM_PROVIDER: ollama
      # The same address Open WebUI uses (the render guard; Ollama directly if the guard is not in the path).
      LDR_LLM_OLLAMA_URL: ${DEEP_RESEARCH_OLLAMA_URL:-http://render-guard:11434}
      # Off unless the model can think: Ollama refuses think:true for any other model (every run would fail).
      LDR_LLM_OLLAMA_ENABLE_THINKING: ${DEEP_RESEARCH_THINKING:-false}
      # The tuned alias and its tuned context: another num_ctx would make Ollama reload the model.
      LDR_LLM_MODEL: ${DEEP_RESEARCH_MODEL:-localai-main:latest}
      LDR_LLM_LOCAL_CONTEXT_WINDOW_SIZE: ${DEEP_RESEARCH_CONTEXT:-32768}
      LDR_SEARCH_TOOL: searxng
      # Set here, not in its settings page: that is what lets it use a private address.
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL: http://searxng:8080
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_RESULT_FORMAT: json
      # A research run sends dozens of searches; spaced out, the sites SearXNG asks are less likely
      # to answer with a CAPTCHA (which looks like 'no results').
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_DELAY_BETWEEN_REQUESTS: "3"
      LDR_RATE_LIMITING_PROFILE: conservative
      # The installer creates the one account, then turns sign-up off.
      LDR_APP_ALLOW_REGISTRATIONS: ${DEEP_RESEARCH_ALLOW_REGISTRATIONS:-true}
    depends_on:
      - searxng
      - render-guard
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  open-webui:
    name: open-webui
  deep-research:
    name: localai-deep-research
