# Local AI stack: Open WebUI (chat, memory, RAG, tools) + SearXNG (private web search)
# + render-guard (keeps chats off the GPU while ComfyUI renders).
# Ollama is NOT in here on purpose: it runs natively on Windows so it gets the RTX 3090 directly.
#
# Managed by Install-LocalAI.ps1 / Update-OpenWebUI.ps1. Secrets and versions come from the
# .env file the installer writes next to this file (C:\AI\Stack\.env, ACL-restricted).
#
# Every port is bound to 127.0.0.1 so nothing is reachable from the LAN. For phone access
# later, use `tailscale serve` in front of 127.0.0.1:3000 instead of opening ports.

name: localai

# Container logs are capped (Docker keeps them forever by default; the render guard alone can log
# thousands of lines a day while Ollama is down). 3 x 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.11.4}
    container_name: open-webui
    logging: *logging
    restart: always
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Same volume name as the manual `docker run -v open-webui:...` install, so chats,
      # memories and settings carry over and the guide's backup commands still work.
      - open-webui:/app/backend/data
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is missing from .env}
      WEBUI_URL: http://localhost:${WEBUI_PORT:-3000}
      # Headless admin creation. Only used while the database has zero users; it also
      # disables open signup. The installer blanks the password in .env after first login.
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      # First-boot default only; the installer sets the live value through the API.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://render-guard:11434}
      ENABLE_OPENAI_API: "false"
      # First-boot defaults. Open WebUI copies these into its database on first start and
      # ignores them afterwards; the installer re-applies them through the API on every run.
      ENABLE_MEMORIES: "true"
      RAG_TEXT_SPLITTER: token
      ENABLE_MARKDOWN_HEADER_TEXT_SPLITTER: "true"
      CHUNK_SIZE: "2000"
      CHUNK_OVERLAP: "200"
      RAG_TOP_K: "5"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "5"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    depends_on:
      - searxng
      - render-guard

  # Pass-through proxy in front of Ollama (stack/render-guard/render_guard.py, standard library
  # only). While ComfyUI has a job running or queued, chats run on the CPU (num_gpu 0) instead of
  # pushing the render out of VRAM; when ComfyUI is idle but still caches models in VRAM, it asks
  # ComfyUI to free them first. Reuses the Python inside the already-pulled SearXNG image (no
  # extra download). Not published on any host port; only Open WebUI talks to it.
  render-guard:
    image: searxng/searxng:${SEARXNG_VERSION:-2026.10.2-19ffbcd30}
    container_name: render-guard
    logging: *logging
    restart: always
    entrypoint: ["python3", "-u", "/guard/render_guard.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./render-guard:/guard:ro
    environment:
      UPSTREAM: ${OLLAMA_UPSTREAM:-http://host.docker.internal:11434}
      # Comfy Desktop listens on 8000, the portable build on 8188 (both on 127.0.0.1).
      COMFYUI_URLS: ${COMFYUI_URLS:-http://host.docker.internal:8188,http://host.docker.internal:8000}
      RENDER_GUARD_MODE: ${RENDER_GUARD_MODE:-cpu}
      FREE_COMFYUI_WHEN_IDLE: ${FREE_COMFYUI_WHEN_IDLE:-1}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:11434/render-guard/status',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-2026.10.2-19ffbcd30}
    container_name: searxng
    logging: *logging
    restart: always
    ports:
      # Optional: lets you use http://localhost:8888 as a private search engine in your browser.
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      # The image listens on "::" by default, which fails on hosts without IPv6.
      # This is the bind address inside the container; exposure is still decided by "ports".
      GRANIAN_HOST: 0.0.0.0

volumes:
  open-webui:
    name: open-webui
