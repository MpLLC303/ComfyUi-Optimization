# Runs the local-llm scripts' checks on real Windows PowerShell 5.1, which the scripts target
# (the development sandbox only has PowerShell 7 on Linux).
name: local-llm (Windows PowerShell 5.1)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['local-llm/**', '.github/workflows/local-llm-windows.yml']
  pull_request:
    paths: ['local-llm/**', '.github/workflows/local-llm-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

# The test scripts refuse to run on machines not marked as throwaway sandboxes.
env:
  LAI_SANDBOX: '1'
  # The skips this job allows, one skip message per line: none. This job exists for the blocks that
  # run on Windows PowerShell 5.1 only, so a block that prints SKIP here (a runner without
  # administrator rights, a suite started by another PowerShell) has lost its only run. The suite
  # steps below go through tests/Invoke-AllTests.ps1 -Step, which under CI fails a step for every
  # skip that is not listed here.
  LAI_DECLARED_SKIPS: ''

jobs:
  windows-ps51:
    runs-on: windows-latest
    # 30, not 20: the bootstrap suite now starts about 40 child PowerShell runs on this job and the
    # unit tests grew by about a minute, and no run has timed the two together yet. The bootstrap
    # suite prints its seconds part by part, so the first log shows what 20 would have left.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: PowerShell version
        shell: powershell
        run: $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Host

      # The runner's self-test needs /bin/sh and runs on the Linux job. This is its skip case on
      # Windows PowerShell 5.1, through -Step as the suite steps below use it: a suite that exits 0
      # but printed a SKIP line fails the step with a line that names the skip, and passes once the
      # job declares that skip. A suite's own exit code and its arguments come through as they are.
      # And a suite that ends with exit 0 without its PASSED line fails the step: -Step knows that
      # line by the suite's file name, so the made-up suite here carries the name of a real one.
      # Each run's output is caught (6>&1: the runner prints with Write-Host), shown, and searched.
      - name: A skipped test fails the step (test runner -Step on Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = Join-Path $env:RUNNER_TEMP 'lai-fake-skip.ps1'
          Set-Content -LiteralPath $fake -Value @("Write-Host '  SKIP        fake block runs on another system only'", "Write-Host 'FAKE PASSED'", 'exit 0')
          $naming = 'ASSERT FAIL skipped under CI, not declared for this job: fake block runs on another system only'
          Write-Host '--- 1. the skip is not declared: exit 1, and one ASSERT FAIL line that names the skip'
          $shown = @(& .\local-llm\tests\Invoke-AllTests.ps1 -Step $fake 6>&1 | ForEach-Object { "$_" })
          $undeclared = $LASTEXITCODE
          $shown | ForEach-Object { Write-Host $_ }
          $named = @($shown | Where-Object { $_.Trim() -eq $naming }).Count
          Write-Host '--- 2. the job declares it (second of two lines): exit 0, and no ASSERT FAIL line'
          $env:LAI_DECLARED_SKIPS = "some other block`nfake block runs on another system only"
          $shown = @(& .\local-llm\tests\Invoke-AllTests.ps1 -Step $fake 6>&1 | ForEach-Object { "$_" })
          $declared = $LASTEXITCODE
          $shown | ForEach-Object { Write-Host $_ }
          $blamed = @($shown | Where-Object { $_ -match 'ASSERT FAIL' }).Count
          Write-Host '--- 3. a suite in a folder with a space in its name, given an argument with a space, that ends with exit 3: the argument arrives whole, and exit 3'
          $spaced = Join-Path $env:RUNNER_TEMP 'lai fake suites'
          New-Item -ItemType Directory -Force -Path $spaced | Out-Null
          $fakeExit = Join-Path $spaced 'lai-fake-exit.ps1'
          Set-Content -LiteralPath $fakeExit -Value @('param([string]$Say)', 'Write-Host "said: [$Say]"', 'exit 3')
          $shown = @(& .\local-llm\tests\Invoke-AllTests.ps1 -Step $fakeExit -StepArgs '-Say', 'two words' 6>&1 | ForEach-Object { "$_" })
          $kept = $LASTEXITCODE
          $shown | ForEach-Object { Write-Host $_ }
          $whole = @($shown | Where-Object { $_ -eq 'said: [two words]' }).Count
          Write-Host '--- 4. a made-up suite with the file name of a real one that ends with exit 0 without the PASSED line of that suite: exit 1, and one ASSERT FAIL line that names the file and the line'
          $fakeEarly = Join-Path $spaced 'Invoke-WatchTest.ps1'
          Set-Content -LiteralPath $fakeEarly -Value @("Write-Host 'stopped before its end'", 'exit 0')
          $shown = @(& .\local-llm\tests\Invoke-AllTests.ps1 -Step $fakeEarly 6>&1 | ForEach-Object { "$_" })
          $early = $LASTEXITCODE
          $shown | ForEach-Object { Write-Host $_ }
          $missed = @($shown | Where-Object { $_ -like '*ASSERT FAIL Invoke-WatchTest.ps1 *WATCH TEST PASSED*' }).Count
          Write-Host "--- undeclared skip: exit $undeclared (wanted 1), lines that name it: $named (wanted 1)"
          Write-Host "--- declared skip: exit $declared (wanted 0), ASSERT FAIL lines: $blamed (wanted 0)"
          Write-Host "--- suite that ends with exit 3: exit $kept (wanted 3), its argument whole: $whole (wanted 1)"
          Write-Host "--- suite that ends with exit 0 without its PASSED line: exit $early (wanted 1), lines that name it: $missed (wanted 1)"
          if ($undeclared -ne 1 -or $named -ne 1 -or $declared -ne 0 -or $blamed -ne 0 -or $kept -ne 3 -or $whole -ne 1 -or $early -ne 1 -or $missed -ne 1) { exit 1 }
          exit 0

      - name: Static checks (5.1 parser, ASCII, PSScriptAnalyzer 5.1 profile, 5.1 pitfall scan)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          }
          Import-Module PSScriptAnalyzer
          & .\local-llm\tests\Invoke-StaticChecks.ps1 -PssaPath 'not-used'
          exit $LASTEXITCODE

      - name: Windows unit tests (mutex ACL, .lnk, UTF-8 bodies, watch/uninstall/stop smoke)
        shell: powershell
        run: |
          & .\local-llm\tests\Invoke-AllTests.ps1 -Step .\local-llm\tests\Invoke-WindowsUnitTests.ps1
          exit $LASTEXITCODE

      # Needs administrator rights (the runner has them): its end-to-end block creates the empty
      # all-users Start-menu folder 'Local AI' for one run and removes it again.
      # One part needs the network: it asks GitHub itself for the list of files and for the archive
      # of this run's commit (-ProbeCommit: the head commit of a pull request, else the commit that
      # was pushed; -ProbeRepo: this repository), and holds the two against each other, here with
      # Windows PowerShell 5.1 as a PC does. GITHUB_TOKEN goes to GitHub's API only; the archive is
      # asked for without it. Started without -ProbeCommit that part prints 'SKIP GitHub itself
      # ...', which this job does not declare (it declares none): the step then fails.
      - name: Bootstrap update review (Get-LocalAI.ps1)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAI_PROBE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & .\local-llm\tests\Invoke-AllTests.ps1 -Step .\local-llm\tests\Invoke-GetLocalAITest.ps1 -StepArgs '-ProbeCommit', $env:LAI_PROBE_COMMIT, '-ProbeRepo', $env:GITHUB_REPOSITORY
          exit $LASTEXITCODE
